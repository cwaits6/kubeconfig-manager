[project]
name = "kubeconfig-manager"
version = "1.2.0"
description = "A Python CLI that merges multiple Kubernetes kubeconfig files into your main $HOME/.kube/config, deep-diffs duplicate entries, and interactively prompts you to overwrite or keep existing settings."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "requests>=2.32.0",
]

[tool.uv]
# Floor the transitive urllib3 (via requests) to a patched release.
# 2.6.3 is affected by CVE-2026-44431 and CVE-2026-44432 (fixed in 2.7.0).
constraint-dependencies = ["urllib3>=2.7.0"]

